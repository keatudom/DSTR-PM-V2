# ============================================================
# dstr-api — Cloudflare Worker (engine ใหม่ของ DSTR-PM)
# ย้ายจาก Apps Script + Google Sheets → Workers + D1 + R2
# หลักการ: contract-preserving (ดู docs/migration-cloudflare/BLUEPRINT.md §1)
# ============================================================
name = "dstr-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 (ฐานข้อมูล SQLite แทน Google Sheets) ──
# database_id เติมหลัง `wrangler d1 create dstr-db` (Session 1 gate)
[[d1_databases]]
binding = "DB"
database_name = "dstr-db"
database_id = "5f4125bf-59a5-4d16-9a04-5826b0b695b4"
migrations_dir = "migrations"

# ── R2 (เก็บรูป/ไฟล์ใหม่ แทน Google Drive; ลิงก์ Drive เก่ายังใช้ต่อ) ──
# ✅ เปิดแล้ว 2026-07-15: bucket 'dstr-media' สร้างสำเร็จ (บัญชีเปิด R2 ไว้แล้ว ไม่ต้องผูกบัตรเพิ่ม)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dstr-media"

# ── ตัวแปรสาธารณะ (ไม่ใช่ความลับ) ──
# ALLOW_ANON_READ='true' = คงพฤติกรรมเดิม (read เปิด anonymous) จนกว่าจะปิดหลังตัดยอด (BLUEPRINT §7)
# ALLOWED_ORIGINS = origin ที่ยิงเข้าได้ (GitHub Pages ของ repo นี้ + localhost dev)
[vars]
ALLOW_ANON_READ = "true"
ALLOWED_ORIGINS = "https://keatudom.github.io,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
GOOGLE_CLIENT_ID = "1007106153160-bih4m06f6qdrche186s7ng4u85ghs6t0.apps.googleusercontent.com"

# ── Secrets (ตั้งด้วย `wrangler secret put <NAME>` — ห้าม commit ค่า) ──
# AUTH_SECRET, GEMINI_API_KEY, GEMINI_MODEL, GEMINI_VISION_MODEL,
# ADMIN_PASSWORD, CLIENT_PASSWORD, LINE_TOKEN, LINE_GROUP_ID,
# LINE_GROUP_OPS_ID, LINE_OWNER_UID  (รวม 10 ตัว — จดลง secrets-ledger)

# ── Cron Triggers (LINE digests) — handler = scheduled() ใน index.ts
# ✅ เปิดแล้ว 2026-08-07: เดิมพักไว้ 2026-07-15 เพราะ /schedules API ลงทะเบียนไม่ผ่าน (บัญชีใหม่)
#    พร้อมกับย้าย LINE webhook จาก Apps Script → Worker ตัวนี้ (ตัวเก่าอ่าน Sheets ที่ไม่มีข้อมูลแล้ว
#    → รายงานออกทุกวันแต่ "0 รายการ") · trigger เวลาฝั่ง Apps Script ถูกลบแล้วเช่นกัน
#
# ⚖️ เจ้าของงานเคาะ 2026-08-07: **เอาตัวเดียว = สรุปรายวัน 18:00 น.ไทย** (= 11:00 UTC)
#    → ถอด ops ทุก 3 ชม. ("0 */3 * * *") และ weekly อาทิตย์ ("0 12 * * SUN") ออกจาก cron
#    โค้ด digest ทั้งสองยังอยู่ครบ · สั่งมือได้ตลอดผ่านคำสั่งในกลุ่ม (/รายงานหน้างาน, /รายงานสัปดาห์นี้)
#    ถ้าจะเปิดอัตโนมัติอีกครั้ง = เติม cron string กลับเข้า list นี้ (+ เช็ค scheduled() ใน index.ts)
#
# ⚠️ กับดัก: วันอาทิตย์ต้องเขียน SUN (หรือ 7) — CF ไม่รับ '0' → เดิม "0 12 * * 0" ทำให้ทั้งชุด
#    ลงทะเบียนไม่ผ่าน (นี่คือสาเหตุจริงของ error 2026-07-15 ไม่ใช่เรื่องบัญชีใหม่)
#    cron string ต้องตรงกับที่เทียบใน scheduled() ของ index.ts เป๊ะ
[triggers]
crons = ["0 11 * * *"]
