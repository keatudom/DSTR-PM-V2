<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังรูปภาพ — DSTR PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  /* ── คลังรูปภาพ (v3) — id เดียวกับหน้า root เพื่อใช้ js/gallery.js ร่วมกัน ── */
  .gl-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-4); flex-wrap:wrap; gap:var(--space-2); }
  .gl-head h1 { font-size:var(--text-2xl); }
  .gl-hdr-sub { font-size:var(--text-sm); color:var(--color-slate-500); margin-top:2px; }

  .gl-chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
  .gl-chip { flex:0 0 auto; border:1px solid var(--color-slate-200); background:#fff; color:var(--color-slate-600);
             border-radius:var(--radius-full); padding:7px 13px; font-size:var(--text-xs); font-weight:600;
             cursor:pointer; font-family:inherit; white-space:nowrap; }
  .gl-chip .n { opacity:.65; margin-left:3px; font-weight:500; }
  .gl-chip.on { color:#fff; border-color:transparent; }
  .gl-chip.on[data-src="all"]     { background:var(--color-slate-800, #1e293b); }
  .gl-chip.on[data-src="daily"]   { background:#378ADD; }
  .gl-chip.on[data-src="checkin"] { background:#BA7517; }
  .gl-chip.on[data-src="task"]    { background:#1D9E75; }
  .gl-chip.on[data-src="qc"]      { background:#7C3AED; }

  .gl-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .gl-filters input, .gl-filters select {
    font-family:inherit; font-size:var(--text-xs); padding:8px 10px; border:1px solid var(--color-slate-200);
    border-radius:var(--radius-md); background:#fff; color:var(--color-slate-900); }
  .gl-filters input[type="date"] { width:140px; }
  .gl-filters .grow { flex:1; min-width:150px; }
  .gl-clear { background:none; border:none; color:var(--color-slate-500); font-size:var(--text-xs);
              cursor:pointer; font-family:inherit; text-decoration:underline; }

  .gl-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .gl-count { font-size:var(--text-xs); color:var(--color-slate-500); }
  .gl-actions { display:flex; gap:7px; flex-wrap:wrap; }
  .gl-btn { font-family:inherit; font-size:var(--text-xs); font-weight:600; padding:8px 12px;
            border-radius:var(--radius-md); cursor:pointer; border:1px solid var(--color-slate-200);
            background:#fff; color:var(--color-slate-600); }
  .gl-btn.primary { background:var(--color-slate-800, #1e293b); border-color:transparent; color:#fff; }
  .gl-btn:disabled { opacity:.45; cursor:not-allowed; }

  .gl-day { font-size:var(--text-xs); font-weight:700; color:var(--color-slate-700); background:var(--color-slate-100);
            padding:6px 11px; border-radius:var(--radius-md); display:inline-block; margin:16px 0 9px; }
  .gl-day:first-of-type { margin-top:4px; }

  .gl-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
  .gl-tile { position:relative; border-radius:var(--radius-lg); overflow:hidden; background:var(--color-slate-100);
             aspect-ratio:1/1; cursor:pointer; }
  .gl-tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .gl-tile .cap { position:absolute; left:0; right:0; bottom:0; padding:14px 6px 5px; font-size:9px; color:#fff;
                  background:linear-gradient(transparent, rgba(0,0,0,.72)); line-height:1.35;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gl-tile .src { position:absolute; top:5px; left:5px; font-size:9px; font-weight:700; color:#fff;
                  padding:2px 6px; border-radius:var(--radius-full); }
  .src-daily { background:#378ADD; } .src-checkin { background:#BA7517; }
  .src-task  { background:#1D9E75; } .src-qc      { background:#7C3AED; }
  .gl-tile .pick { position:absolute; top:4px; right:4px; width:23px; height:23px; border-radius:50%;
                   border:2px solid rgba(255,255,255,.9); background:rgba(0,0,0,.28); cursor:pointer;
                   display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; line-height:1; }
  .gl-tile.sel { outline:3px solid var(--color-slate-800, #1e293b); outline-offset:-3px; }
  .gl-tile.sel .pick { background:var(--color-slate-800, #1e293b); border-color:#fff; }

  .gl-empty { text-align:center; color:var(--color-slate-400); font-size:var(--text-sm); padding:44px 12px; }
  .gl-more { text-align:center; margin:18px 0 4px; }
  .gl-note { font-size:11px; color:var(--color-warning-700); background:var(--color-warning-50);
             border-radius:var(--radius-md); padding:9px 12px; margin-bottom:12px; }

  .gl-view { position:fixed; inset:0; background:#0f172a; z-index:9999; display:none; flex-direction:column; }
  .gl-view.open { display:flex; }
  .gl-view-top { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; gap:10px; }
  .gl-view-top .x { background:rgba(255,255,255,.14); border:none; color:#fff; width:34px; height:34px;
                    border-radius:50%; font-size:17px; cursor:pointer; line-height:1; }
  .gl-view-body { flex:1; display:flex; align-items:center; justify-content:center; padding:0 8px; min-height:0; position:relative; }
  .gl-view-body img { max-width:100%; max-height:100%; object-fit:contain; border-radius:var(--radius-lg); }
  .gl-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.14); border:none;
            color:#fff; width:38px; height:56px; border-radius:var(--radius-md); font-size:20px; cursor:pointer; }
  .gl-nav.prev { left:6px; } .gl-nav.next { right:6px; }
  .gl-view-info { color:#E2E8F0; padding:12px 16px 18px; font-size:var(--text-xs); line-height:1.6; }
  .gl-view-info .t { color:#fff; font-weight:600; font-size:var(--text-sm); margin-bottom:3px; }
  .gl-view-info .meta { color:#94A3B8; font-size:11px; }
  .gl-view-info .acts { margin-top:11px; display:flex; gap:8px; flex-wrap:wrap; }

  .gl-sel-bar { position:fixed; left:0; right:0; bottom:0; background:var(--color-slate-800, #1e293b); color:#fff;
                z-index:900; padding:11px 14px; display:none; justify-content:space-between; align-items:center;
                gap:10px; box-shadow:0 -3px 14px rgba(0,0,0,.18); }
  .gl-sel-bar.on { display:flex; }
  .gl-sel-bar .n { font-size:var(--text-sm); font-weight:600; }
  .gl-sel-bar button { font-family:inherit; font-size:var(--text-xs); font-weight:600; padding:8px 13px;
                       border-radius:var(--radius-md); border:none; cursor:pointer; }
  .gl-sel-bar .go { background:#fff; color:var(--color-slate-800, #1e293b); }
  .gl-sel-bar .no { background:rgba(255,255,255,.16); color:#fff; }
  .gl-sel-bar button:disabled { opacity:.55; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <div class="page-content" style="padding-bottom:70px">

        <div class="gl-head">
          <div>
            <h1><i data-lucide="images" style="width:24px;height:24px;vertical-align:-4px"></i> คลังรูปภาพ</h1>
            <div class="gl-hdr-sub" id="hdrSub">กำลังโหลด...</div>
          </div>
        </div>

        <div id="loadingScreen" class="gl-empty">กำลังโหลดรูป...</div>
        <div id="gasNotice" class="gl-note" style="display:none">
          ⚠️ คลังรูปภาพทำงานบนเครื่องยนต์ใหม่ (Cloudflare) เท่านั้น
        </div>

        <div id="main" style="display:none">
          <div class="gl-chips" id="chips"></div>

          <div class="gl-filters">
            <input type="date" id="fFrom" onchange="applyFilters()" title="ตั้งแต่วันที่">
            <span style="color:var(--color-slate-400);font-size:var(--text-xs)">ถึง</span>
            <input type="date" id="fTo" onchange="applyFilters()" title="ถึงวันที่">
            <select id="fFF" onchange="applyFilters()"><option value="">ทุกชิ้นงาน</option></select>
            <input type="search" id="fQ" class="grow" placeholder="ค้นหาข้อความ / ชื่อคน" oninput="debouncedFilter()">
            <button class="gl-clear" onclick="clearFilters()">ล้างตัวกรอง</button>
          </div>

          <div class="gl-bar">
            <div class="gl-count" id="countLine">—</div>
            <div class="gl-actions">
              <button class="gl-btn" onclick="selectAllShown()">เลือกรูปที่เห็นทั้งหมด</button>
              <button class="gl-btn" onclick="reload()"><i data-lucide="refresh-cw"></i> รีเฟรช</button>
            </div>
          </div>

          <div id="legacyNote" class="gl-note" style="display:none"></div>
          <div id="grid"></div>
          <div class="gl-more" id="moreWrap" style="display:none">
            <button class="gl-btn" onclick="showMore()">โหลดรูปเพิ่ม</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="gl-sel-bar" id="selBar">
    <span class="n" id="selCount">เลือกแล้ว 0 รูป</span>
    <span style="display:flex;gap:7px">
      <button class="no" onclick="clearSelection()">ยกเลิก</button>
      <button class="go" id="btnDl" onclick="downloadSelected()">⬇ ดาวน์โหลด</button>
    </span>
  </div>

  <div class="gl-view" id="viewer">
    <div class="gl-view-top">
      <span id="vSrc" style="font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px"></span>
      <button class="x" onclick="closeViewer()">✕</button>
    </div>
    <div class="gl-view-body">
      <button class="gl-nav prev" onclick="stepViewer(-1)">‹</button>
      <img id="vImg" alt="">
      <button class="gl-nav next" onclick="stepViewer(1)">›</button>
    </div>
    <div class="gl-view-info">
      <div class="t" id="vTitle"></div>
      <div id="vDetail"></div>
      <div class="meta" id="vMeta"></div>
      <div class="acts">
        <button class="gl-btn primary" onclick="downloadCurrent()">⬇ ดาวน์โหลดรูปนี้</button>
        <button class="gl-btn" onclick="openSource()">ดูต้นทาง</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../vendor/lucide/lucide.min.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/gallery.js"></script>
  <script>
  // ตรรกะทั้งหมดอยู่ใน ../js/gallery.js (ใช้ร่วมกับ /gallery.html) — ที่นี่เหลือแค่ boot
  if (!Auth.requireAuth('admin')) { /* redirect */ }
  Shell.render({ page: 'gallery', title: 'คลังรูปภาพ', scope: 'project' });

  (async function() {
    await galleryInit();
    if (window.lucide) lucide.createIcons();
  })();
  </script>
</body>
</html>
